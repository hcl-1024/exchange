<app-header></app-header>

<h1 class="text-8xl m-8 ml-10">{{item.title}}</h1>
<div class="bg-black w-10/12 h-[2px] m-10 mt-1 ml-16"></div>
<h1 class="text-lg m-8 ml-20">{{item.desc}}</h1>

<div class="text-center items-center">
    <h1 class="text-sm mt-8 mx-60">{{item.content}}</h1>
    <img src="{{item.image_src}}" alt="" class="ml-auto mr-auto my-6">
    <h1 (click)="like()" *ngIf="!liked">Like</h1>
    <h1 (click)="like()" *ngIf="liked">Unlike</h1>
    <h1 (click)="signupEvent()" *ngIf="signup">Sign up</h1>
    <h1 (click)="deleteItem(id!)" [hidden]="uid != posterUID">Delete</h1>

    <h1 (click)="getComments()" [hidden]="showComments" class="text-lg mt-3">Show Comments</h1>
    <h1 (click)="hideComments()" [hidden]="!showComments" class="text-lg mt-3">Hide Comments</h1>
    <app-comment-form [hidden]="!showComments" (submittedForm)="giveComment($event)"></app-comment-form>
    <h1 *ngFor="let com of combined; index as i" [hidden]="!showComments" class="text-left py-5 pl-8 w-screen bg-slate-200 rounded-xl">
        <h1 *ngFor="let data of com; index as i">
            <h1 *ngIf="i == 0">
                {{data}}
            </h1>

            <h1 *ngIf="i == 1">
                {{data}}
            </h1>
        </h1>
    </h1>
</div>
