<form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
    <input id="title" type="text" formControlName="title" placeholder="Title" class="h-10 w-11/12">

    <div *ngIf="form.title.invalid && (form.title.dirty || form.title.touched)">
        <div *ngIf="form.title.hasError('required')">
            Title is required.
        </div>
    </div>

    <input id="desc" type="text" formControlName="desc" placeholder="Description" class="h-10 w-11/12 my-2">

    <br>

    <label for="content" class="h-10 w-11/12">Upload Content </label>
    <input id="content" type="text" formControlName="content" class="">

    <input id="image" type="file" (change)="onImagePicked($event)" class="">

    <br>
    <label for="signup">Will you need a sign-up function in this post? </label>
    <input type="checkbox" id="signup" formControlName="signup">

    <br>

    <button type="submit" [disabled]="!itemForm.valid" class="bg-slate-200 hover:bg-slate-400 cursor-pointer rounded-md px-4 py-2 m-3">Post</button>

    <button (click)="save()" [disabled]="!itemForm.valid" class="bg-slate-200 hover:bg-slate-400 cursor-pointer rounded-md px-4 py-2 m-3">Save without posting</button>
</form>
