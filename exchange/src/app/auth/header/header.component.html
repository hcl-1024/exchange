<ul class="w-screen bg-slate-200 text-right">
        <li class="px-12 py-4 cursor-pointer inline-block hover:bg-white" [routerLink]='["/profile/settings"]'><h1>Hello, {{name}}! </h1></li>
        <li class="px-12 py-4 cursor-pointer inline-block"><h1 [hidden]="name == 'Guest'" (click)="logout()">Logout</h1></li>
        <li class="px-12 py-4 cursor-pointer inline-block"><h1 [hidden]="name != 'Guest'" (click)="login()">Login</h1></li>
</ul>
